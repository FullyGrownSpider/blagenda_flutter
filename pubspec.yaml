name: blagenda_flutter_simple
description: Blagenda But Simple
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  #https://pub.dev/packages/external_path
  external_path: ^2.2.0
  #https://pub.dev/packages/flutter_launcher_icons/install
  #flutter pub run flutter_launcher_icons
  flutter_launcher_icons: ^0.13.1
  # https://pub.dev/packages/date_format/example
  date_format: ^2.0.7
  # https://pub.dev/packages/path_provider
  path_provider: ^2.1.2
  # https://pub.dev/packages/window_manager
  window_manager: ^0.4.2

  permission_handler: ^11.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - icons/
  fonts:
   - family: JetbrainsMonoNL
     fonts:
      - asset: fonts/JetBrainsMono-Regular.ttf
      - asset: fonts/JetBrainsMono-Bold.ttf
        weight: 700
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "F:\\Programming\\blagenda_flutter\\android\\app\\src\\main\\res\\mipmap-hdpi\\ic_launcher.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  windows:
    generate: true
    image_path: "F:\\Programming\\blagenda_flutter\\android\\app\\src\\main\\res\\mipmap-hdpi\\ic_launcher.png"
    icon_size: 256 # min:48, max:256, default: 48