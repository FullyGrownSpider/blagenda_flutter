  google_mlkit_text_recognition: ^0.8.1
  permission_handler: ^10.2.0

  cupertino_icons: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
flutter:
  assets:
    - icons/
  uses-material-design: true
