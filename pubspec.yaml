name: blagenda_flutter_simple
description: Blagenda But Simple
version: 1.0.0+1

environment:
  sdk: '3.0.3'

dependencies:
  flutter:
    sdk: flutter

  #https://pub.dev/packages/http/install
  http: ^1.0.0
  # https://pub.dev/packages/date_format/example
  date_format: ^2.0.7
  # https://pub.dev/packages/path_provider
  path_provider: ^2.0.15


  # https://github.com/svprdga/Text-Recognition-Flutter/blob/master/pubspec.yaml
